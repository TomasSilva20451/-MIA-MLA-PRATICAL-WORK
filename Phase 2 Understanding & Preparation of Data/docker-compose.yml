version: '3.8'

services:
  financial-risk-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-risk-api
    ports:
      - "8000:8000"
    volumes:
      # Mount monitoring directory to persist logs
      - ./artifacts/monitoring:/code/artifacts/monitoring
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

